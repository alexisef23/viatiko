<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0D1322" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="28" fill="url(#bgGlow)"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#compassGrad)" stroke-width="2.5" stroke-dasharray="4 2" opacity="0.85"/>
  
  <!-- Cardinal Marks -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#FF5A5F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Compass Needle (North: Coral Red, South: Cyan/White) -->
  <polygon points="32,12 37,32 32,28" fill="#FF5A5F"/>
  <polygon points="32,12 27,32 32,28" fill="#FF7E82"/>
  <polygon points="32,52 37,32 32,36" fill="#06B6D4"/>
  <polygon points="32,52 27,32 32,36" fill="#A5F3FC"/>
  
  <!-- Central Pivot -->
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="2" fill="#0D1322"/>
</svg>
